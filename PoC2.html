<html>
  <body>
    <button id="run">Undo 2 merges</button>
    <script>
      const deactivatedIdsNewestFirst = [1863937, 1393856]; // use DEACTIVATED IDs
      const delay = 1500;

      function postInPopup(list) {
        if (list.length === 0) return;
        const id = list.shift();

        const w = window.open('', '_blank', 'width=400,height=300');
        if (!w) { alert('Allow popups for this site'); return; }

        w.document.write(`
          <form id="f" method="POST"
                action="https://integration.servicetitan.com/app/api/customers/${id}/undoMerge">
          </form>
          <script>document.getElementById('f').submit();<\/script>
        `);

        setTimeout(() => { try { w.close(); } catch {} ; setTimeout(() => postInPopup(list), delay); }, 2000);
      }

      document.getElementById('run').onclick = () => postInPopup([...deactivatedIdsNewestFirst]);
    </script>
  </body>
</html>
